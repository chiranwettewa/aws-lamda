spring.application.name=podiweda-backend

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never

# AWS Cognito Configuration
aws.cognito.region=${AWS_REGION:us-east-1}
aws.cognito.userPoolId=${COGNITO_USER_POOL_ID}
aws.cognito.clientId=${COGNITO_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${aws.cognito.region}.amazonaws.com/${aws.cognito.userPoolId}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.${aws.cognito.region}.amazonaws.com/${aws.cognito.userPoolId}/.well-known/jwks.json

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# Logging
logging.level.org.springframework.security=${LOG_LEVEL:INFO}
logging.level.org.example=${LOG_LEVEL:INFO}
